spring:
  application:
    name: myfeeder
  # Applies to the auto-configured RestClient (feed fetches + Raindrop): bound how long a slow
  # remote can tie up a request/scheduler thread. Without these the HTTP client waits indefinitely.
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 30s
  # TypeSafe Jev (interest scoring). The key is optional: blank means Jev is disabled and the app
  # still starts. The model is pinned (JEV-03). SDK retries are off because the Resilience4j "jev"
  # instance is the only retry layer.
  ai:
    typesafe:
      api-key: ${MYFEEDER_TYPESAFE_API_KEY:}
      model: jev-1.13.0
      # D-05: calibration measured ~2.6s average and >5s cold for a profile plus 7 topics; the rubric can grow to 25 topics.
      timeout: 30s
      retry:
        max-retries: 0

myfeeder:
  polling:
    default-interval-minutes: 15
    max-interval-minutes: 1440
    backoff-threshold: 5
  retention:
    full-content-days: 30
    cleanup-cron: "0 0 3 * * *"
  raindrop:
    api-base-url: https://api.raindrop.io/rest/v1
    api-token: ${MYFEEDER_RAINDROP_API_TOKEN:}

resilience4j:
  circuitbreaker:
    # D-07: lower order = outer aspect. The breaker wraps the retry and records one outcome per logical call.
    circuit-breaker-aspect-order: 1
    instances:
      raindrop:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        ignore-exceptions:
          - org.bartram.myfeeder.integration.RaindropNotConfiguredException
      jev:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        slow-call-duration-threshold: 15s
        slow-call-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 3
        # D-17: OPEN moves to HALF_OPEN after wait-duration-in-open-state without needing a call, so a paused sweep resumes.
        automatic-transition-from-open-to-half-open-enabled: true
        # 401/403 (TypeSafeAuthentication/PermissionDenied) are deliberately absent: a bad key is recorded (D-06)
        ignore-exceptions:
          - org.bartram.myfeeder.integration.JevNotConfiguredException
          - org.springaicommunity.typesafe.exception.TypeSafeBadRequestException
          - org.springaicommunity.typesafe.exception.TypeSafeUnprocessableEntityException
          - org.springaicommunity.typesafe.exception.TypeSafeMissingAnswerException
          - org.springaicommunity.typesafe.exception.TypeSafeAnswerTypeException
          - java.lang.IllegalArgumentException
  retry:
    retry-aspect-order: 2
    instances:
      raindrop:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - org.bartram.myfeeder.integration.RaindropNotConfiguredException
      jev:
        max-attempts: 3
        # Base interval for TypeSafeConfig.jevRetryInterval, which doubles it per attempt (1s, 2s) and
        # honors a 429's retry-after-ms instead when present (capped at 10s).
        wait-duration: 1s
        retry-exceptions:
          - org.springaicommunity.typesafe.exception.TypeSafeRateLimitException
          - org.springaicommunity.typesafe.exception.TypeSafeInternalServerException
          - org.springaicommunity.typesafe.exception.TypeSafeApiConnectionException
        ignore-exceptions:
          - org.bartram.myfeeder.integration.JevNotConfiguredException
