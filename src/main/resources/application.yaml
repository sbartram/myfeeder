spring:
  application:
    name: myfeeder
  # Applies to the auto-configured RestClient (feed fetches + Raindrop): bound how long a slow
  # remote can tie up a request/scheduler thread. Without these the JDK client waits indefinitely.
  http:
    client:
      connect-timeout: 5s
      read-timeout: 30s

myfeeder:
  polling:
    default-interval-minutes: 15
    max-interval-minutes: 1440
    backoff-threshold: 5
  retention:
    full-content-days: 30
    cleanup-cron: "0 0 3 * * *"
  raindrop:
    api-base-url: https://api.raindrop.io/rest/v1
    api-token: ${MYFEEDER_RAINDROP_API_TOKEN:}

resilience4j:
  circuitbreaker:
    instances:
      raindrop:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        ignore-exceptions:
          - org.bartram.myfeeder.integration.RaindropNotConfiguredException
  retry:
    instances:
      raindrop:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - org.bartram.myfeeder.integration.RaindropNotConfiguredException
