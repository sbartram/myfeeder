spring:
  ai:
    anthropic:
      api-key: test-dummy-key
    # Mirrors the main spring.ai.typesafe pins, without a key. The base-url is local: port 9
    # refuses at once, so a stray call can never reach the network.
    typesafe:
      base-url: http://127.0.0.1:9
      model: jev-1.13.0
      timeout: 5s
      retry:
        max-retries: 0
  datasource:
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 30000
  flyway:
    connect-retries: 5
    connect-retries-interval: 2

myfeeder:
  polling:
    default-interval-minutes: 15
    max-interval-minutes: 1440
    backoff-threshold: 5
  retention:
    full-content-days: 30
    cleanup-cron: "0 0 3 * * *"
  raindrop:
    api-base-url: https://api.raindrop.io/rest/v1

resilience4j:
  circuitbreaker:
    instances:
      raindrop:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        ignore-exceptions:
          - org.bartram.myfeeder.integration.RaindropNotConfiguredException
  retry:
    instances:
      raindrop:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - org.bartram.myfeeder.integration.RaindropNotConfiguredException
